name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Remove minimumReleaseAge restriction — CI uses pinned lockfile so it's safe
      - name: Patch pnpm workspace for CI
        run: sed -i 's/minimumReleaseAge:.*/minimumReleaseAge: 0/' pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild (Android)
        working-directory: artifacts/relink-mobile
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: artifacts/relink-mobile/android
        run: ./gradlew assembleRelease --no-daemon -x lint
        env:
          GRADLE_OPTS: '-Xmx3g'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relink-apk
          path: artifacts/relink-mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
