name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Disable minimumReleaseAge for CI
        run: |
          node -e "
          const fs = require('fs');
          let c = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          c = c.replace(/^minimumReleaseAge:\s*\d+/m, 'minimumReleaseAge: 0');
          fs.writeFileSync('pnpm-workspace.yaml', c);
          console.log('minimumReleaseAge disabled for CI');
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        working-directory: artifacts/relink-mobile
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cmVsZXZhbnQtamVubmV0LTU4LmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_DOMAIN: workspace.mikam514.replit.app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Show generated build.gradle (debug)
        run: cat artifacts/relink-mobile/android/app/build.gradle

      - name: Generate keystore
        working-directory: artifacts/relink-mobile/android/app
        run: |
          keytool -genkey -v \
            -keystore relink.keystore \
            -alias relink \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass relinkpass \
            -keypass relinkpass \
            -dname "CN=ReLink AI, OU=Mobile, O=ReLink, L=Paris, S=IDF, C=FR"

      - name: Build signed release APK
        working-directory: artifacts/relink-mobile/android
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
        run: |
          ./gradlew assembleRelease --no-daemon -x lint \
            -Pandroid.injected.signing.store.file=$(pwd)/app/relink.keystore \
            -Pandroid.injected.signing.store.password=relinkpass \
            -Pandroid.injected.signing.key.alias=relink \
            -Pandroid.injected.signing.key.password=relinkpass \
            --stacktrace 2>&1 | tee /tmp/gradle.log | tail -150
          echo "--- Exit code: $?"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relink-apk
          path: artifacts/relink-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 3
