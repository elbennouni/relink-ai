name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Patch pnpm-workspace for CI
        run: sed -i 's/^minimumReleaseAge:.*/minimumReleaseAge: 0/' pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        working-directory: artifacts/relink-mobile
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate keystore
        working-directory: artifacts/relink-mobile/android/app
        run: |
          keytool -genkey -v \
            -keystore relink.keystore \
            -alias relink \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass relinkpass \
            -keypass relinkpass \
            -dname "CN=ReLink AI, OU=Mobile, O=ReLink, L=Paris, S=IDF, C=FR"

      - name: Inject signing config into build.gradle
        working-directory: artifacts/relink-mobile/android/app
        run: |
          node -e "
          const fs = require('fs');
          let c = fs.readFileSync('build.gradle', 'utf8');

          // Insert signingConfigs block before buildTypes
          const sigBlock = \`
              signingConfigs {
                  release {
                      storeFile file('relink.keystore')
                      storePassword 'relinkpass'
                      keyAlias 'relink'
                      keyPassword 'relinkpass'
                  }
              }
          \`;
          c = c.replace('    buildTypes {', sigBlock + '    buildTypes {');

          // Add signingConfig inside release buildType
          c = c.replace(
            /release \{/,
            'release {\n            signingConfig signingConfigs.release'
          );

          fs.writeFileSync('build.gradle', c);
          console.log('Signing config injected successfully');
          "

      - name: Build signed release APK
        working-directory: artifacts/relink-mobile/android
        env:
          GRADLE_OPTS: '-Xmx3g'
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN }}
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relink-apk
          path: artifacts/relink-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
