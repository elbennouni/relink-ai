name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/relink-mobile/android/**/*.gradle*', 'artifacts/relink-mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android build-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/build-cache
          key: android-build-cache-${{ runner.os }}-${{ hashFiles('artifacts/relink-mobile/android/**/*.gradle*') }}
          restore-keys: |
            android-build-cache-${{ runner.os }}-

      - name: Disable minimumReleaseAge for CI
        run: |
          node -e "
          const fs = require('fs');
          let c = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          c = c.replace(/^minimumReleaseAge:\s*\d+/m, 'minimumReleaseAge: 0');
          fs.writeFileSync('pnpm-workspace.yaml', c);
          console.log('minimumReleaseAge disabled for CI');
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        working-directory: artifacts/relink-mobile
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cmVsZXZhbnQtamVubmV0LTU4LmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_DOMAIN: ai-agent-tool-mikam514.replit.app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate keystore
        working-directory: artifacts/relink-mobile/android/app
        run: |
          keytool -genkey -v \
            -keystore relink.keystore \
            -alias relink \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass relinkpass \
            -keypass relinkpass \
            -dname "CN=ReLink AI, OU=Mobile, O=ReLink, L=Paris, S=IDF, C=FR"

      - name: Build signed release APK
        working-directory: artifacts/relink-mobile/android
        env:
          GRADLE_OPTS: '-Xmx3g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError'
        run: |
          ./gradlew assembleRelease --no-daemon -x lint \
            --build-cache \
            -Pandroid.injected.signing.store.file=$(pwd)/app/relink.keystore \
            -Pandroid.injected.signing.store.password=relinkpass \
            -Pandroid.injected.signing.key.alias=relink \
            -Pandroid.injected.signing.key.password=relinkpass \
            --stacktrace 2>&1 | tee /tmp/gradle.log
          tail -50 /tmp/gradle.log

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find artifacts/relink-mobile/android -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: relink-apk
          path: ${{ steps.find_apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create / update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "ReLink AI – APK Android"
          body: |
            APK signé connecté à ai-agent-tool-mikam514.replit.app
            Construit le ${{ github.run_number }} · commit ${{ github.sha }}
          prerelease: false
          files: ${{ steps.find_apk.outputs.path }}
          make_latest: true

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 3
